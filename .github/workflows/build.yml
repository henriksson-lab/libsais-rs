name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      - name: Build
        run: cargo build --all-targets

      # The threaded paths are checked against this crate's own serial paths, so
      # this needs no C toolchain and runs without the upstream-c feature.
      # macos-latest runners are arm64 and ubuntu-latest is x86_64, so the
      # architecture-specific prefetch paths are both executed here.
      - name: Test
        run: cargo test --release --lib
