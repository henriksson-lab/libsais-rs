name: Release

# Publishes to crates.io when a v* tag is pushed, e.g. `git tag v0.2.3 && git push origin v0.2.3`.
#
# One-time setup before the first run:
#   1. Create a crates.io API token scoped to publish-update for this crate.
#   2. Add it as the repository secret CARGO_REGISTRY_TOKEN.
#   3. Optionally create a GitHub environment named `crates-io` and add a
#      required reviewer, so publishing waits for a human click. The job below
#      already references it; without the environment it simply runs.
#
# The publish job cannot start until `verify` passes on all three platforms,
# and `verify` runs `cargo package`, which builds the crate from the packaged
# tarball exactly as crates.io will. A package that would fail to build from the
# registry therefore never reaches the token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      - name: Build
        run: cargo build --release --all-targets

      # Runs the bit-identity thread sweeps, which compare the threaded paths
      # against this crate's own serial paths. Needs no C toolchain, so it works
      # without the upstream-c feature. macos-latest is arm64 and
      # ubuntu-latest is x86_64, so both prefetch paths get executed.
      - name: Test
        run: cargo test --release --lib

      - name: Package
        run: cargo package --allow-dirty

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Select Rust
        run: rustup default stable

      # Refuse to publish a version that does not match the tag, which is the
      # easy mistake: tagging v0.2.4 while Cargo.toml still says 0.2.3 would
      # otherwise silently republish the old number, or fail confusingly.
      - name: Check the tag matches Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
