[package]
name = "libsais-rs"
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
description = "Rust translation of libsais for suffix array construction and related transforms"
readme = "README.md"
repository = "https://github.com/henriksson-lab/libsais-rs"
homepage = "https://github.com/henriksson-lab/libsais-rs"
documentation = "https://docs.rs/libsais-rs"
keywords = ["suffix-array", "bwt", "text", "bioinformatics"]
categories = ["algorithms", "science"]
include = [
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/build.rs",
    "/src/**",
    "/examples/**",
    "/cprobe/**",
]

[lib]
name = "libsais_rs"
path = "src/lib.rs"

[[example]]
name = "bench_vs_c"
required-features = ["upstream-c"]

[features]
default = []
# Build and link the upstream C libsais (with OpenMP) and expose
# `libsais*_upstream_c*` wrappers. Required for the differential test suite.
#
# This feature is for development only. The upstream C source is not shipped
# in the published crate; the feature only works in a source checkout that
# has `./libsais/` populated (see README). Requires GCC with OpenMP
# (libgomp); other toolchains are not supported.
upstream-c = ["dep:cc"]
# Developer-only: accumulate per-phase wall-clock time and rayon pool build
# counts, printed via `libsais_rs::profile::report()`. Adds timing overhead;
# never enable it in a release dependency.
profile = []

[dependencies]
rayon = "1.10"

[build-dependencies]
cc = { version = "1", optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
